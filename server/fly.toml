app = "passersby-api"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  DEVNET_RPC_URL = "https://api.devnet.solana.com"
  MAINNET_RPC_URL = "https://api.mainnet-beta.solana.com"
