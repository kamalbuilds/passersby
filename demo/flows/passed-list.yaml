# Open the kept tickets and wait for the encounter written by the second identity. Env: WHO, SHOTS.
appId: xyz.passersby.app
---
- tapOn: "Encounters"
- extendedWaitUntil:
    visible: "Passed ·.*"
    timeout: 180000
- takeScreenshot: ${WHO}_06_passed_ticket
- runScript:
    file: pause.js
    env:
      MS: '4000'
