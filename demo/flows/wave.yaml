# Wave 5 SKR at the person on the first ticket. Env: WHO, SHOTS.
appId: xyz.passersby.app
---
- tapOn: "Encounters"
- extendedWaitUntil:
    visible: "Wave"
    timeout: 120000
- tapOn: "Wave"
- extendedWaitUntil:
    visible: "Wave 5 SKR"
    timeout: 30000
- takeScreenshot: ${SHOTS}/${WHO}_07_wave_amounts
- tapOn: "Wave 5 SKR"
# wallet: approve the transfer
- extendedWaitUntil:
    visible:
      id: '.*btn_approve'
    timeout: 180000
- takeScreenshot: ${SHOTS}/${WHO}_08_wave_wallet_sheet
- tapOn:
    id: '.*btn_approve'
- extendedWaitUntil:
    visible: "Waved 5 SKR"
    timeout: 240000
- takeScreenshot: ${SHOTS}/${WHO}_09_waved
