# Wave SKR at the person on the first ticket. Env: WHO, SHOTS.
appId: xyz.passersby.app
---
- tapOn: "Encounters"
- extendedWaitUntil:
    visible: "Wave"
    timeout: 120000
- tapOn: "Wave"
- extendedWaitUntil:
    visible: "Wave 1 SKR|1"
    timeout: 30000
- takeScreenshot: ${SHOTS}/${WHO}_07_wave_amounts
- tapOn: "Wave 1 SKR|1"
- extendedWaitUntil:
    visible: "Approve|Send.*|Sign.*"
    timeout: 180000
- takeScreenshot: ${SHOTS}/${WHO}_08_wave_wallet_sheet
- tapOn: "Approve|Send.*|Sign.*"
- extendedWaitUntil:
    visible: "Waved 1 SKR"
    timeout: 240000
- takeScreenshot: ${SHOTS}/${WHO}_09_waved
