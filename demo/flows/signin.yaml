# Connect the mock wallet and trade a signed message for a Passersby session. Env: WHO, SHOTS.
appId: xyz.passersby.app
---
- launchApp
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Connect wallet"
    timeout: 120000
- takeScreenshot: ${SHOTS}/${WHO}_01_signed_out
- runScript:
    file: pause.js
    env:
      MS: '3000'
- tapOn: "Connect wallet"
# wallet: authorize the app
- extendedWaitUntil:
    visible:
      id: '.*btn_connect'
    timeout: 120000
- takeScreenshot: ${SHOTS}/${WHO}_02_wallet_authorize
- tapOn:
    id: '.*btn_connect'
# wallet: sign the sign-in message
- extendedWaitUntil:
    visible:
      id: '.*btn_approve'
    timeout: 120000
- takeScreenshot: ${SHOTS}/${WHO}_03_wallet_sign_message
- tapOn:
    id: '.*btn_approve'
- extendedWaitUntil:
    visible: "Quiet street.*|.*within reach"
    timeout: 120000
- takeScreenshot: ${SHOTS}/${WHO}_04_radar_live
- runScript:
    file: pause.js
    env:
      MS: '5000'
