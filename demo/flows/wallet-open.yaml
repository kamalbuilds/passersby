# Open the mock wallet and tap Authenticate; run-demo.sh then types the device PIN. Env: WHO, SHOTS.
appId: com.solana.mwallet
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Authenticate
    timeout: 90000
- takeScreenshot: ${SHOTS}/${WHO}_00_wallet_home
- tapOn: Authenticate
