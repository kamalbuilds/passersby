name: demo

on:
  workflow_dispatch:
    inputs:
      mode:
        description: probe boots two emulators and checks Bluetooth only. full records the demo.
        type: choice
        options: [full, probe]
        default: full

jobs:
  app-apk:
    if: inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: key
        run: echo "k=$(git log -1 --format=%H -- app)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: app-release-x86_64.apk
          key: app-apk-x86_64-${{ steps.key.outputs.k }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: app/package-lock.json }
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx expo prebuild -p android --no-install
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app-release-x86_64.apk"
      - run: ls -l app-release-x86_64.apk
      - uses: actions/upload-artifact@v4
        with: { name: app-apk, path: app-release-x86_64.apk, retention-days: 3 }

  wallet-apk:
    if: inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: mwallet.apk
          key: wallet-apk-${{ hashFiles('demo/ci/build-wallet.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash demo/ci/build-wallet.sh
      - run: ls -l mwallet.apk
      - uses: actions/upload-artifact@v4
        with: { name: wallet-apk, path: mwallet.apk, retention-days: 3 }

  probe:
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash demo/ci/enable-kvm.sh
      - run: bash demo/ci/emulators-up.sh
      - run: bash demo/ci/bt-probe.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: passersby-probe, path: out, retention-days: 3 }

  demo:
    if: inputs.mode == 'full'
    needs: [app-apk, wallet-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: bash demo/ci/enable-kvm.sh
      - uses: actions/download-artifact@v4
        with: { pattern: '*-apk', path: apks, merge-multiple: true }
      - run: ls -l apks
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: cd demo && npm ci --no-audit --no-fund
      - name: Install Maestro 2.6.0 from its GitHub release
        run: |
          curl -fsSL -o /tmp/maestro.zip https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.6.0/maestro.zip
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro-cli"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - run: maestro --version
      - run: sudo apt-get install -y -qq ffmpeg
      - run: bash demo/ci/emulators-up.sh
      - env:
          CI_FUNDER_KEYPAIR: ${{ secrets.CI_FUNDER_KEYPAIR }}
        run: bash demo/ci/run-demo.sh
      - if: always()
        run: bash demo/ci/finish.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passersby-demo
          path: out
          retention-days: 14
