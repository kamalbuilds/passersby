name: demo

on:
  workflow_dispatch:
    inputs:
      mode:
        description: probe boots two emulators and checks Bluetooth only. full records the demo.
        type: choice
        options: [full, probe]
        default: full
      two_emulators:
        description: record with two emulators and BLE instead of one emulator and the second-identity HTTP encounter
        type: boolean
        default: false

env:
  MAESTRO_VERSION: cli-2.11.0
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a

jobs:
  app-apk:
    if: inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: key
        run: echo "k=$(git log -1 --format=%H -- app)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: app-release-x86_64.apk
          key: app-apk-x86_64-${{ steps.key.outputs.k }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: app/package-lock.json }
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx expo prebuild -p android --no-install
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app-release-x86_64.apk"
          M=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          echo "merged manifest: $M"
          grep -q BLUETOOTH_SCAN "$M"
      - run: ls -l app-release-x86_64.apk
      - uses: actions/upload-artifact@v4
        with: { name: app-apk, path: app-release-x86_64.apk, retention-days: 3 }

  wallet-apk:
    if: inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: mwallet.apk
          key: wallet-apk-${{ hashFiles('demo/ci/build-wallet.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash demo/ci/build-wallet.sh
      - run: ls -l mwallet.apk
      - uses: actions/upload-artifact@v4
        with: { name: wallet-apk, path: mwallet.apk, retention-days: 3 }

  probe:
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash demo/ci/enable-kvm.sh
      - run: bash demo/ci/emulators-up.sh
      - run: bash demo/ci/bt-probe.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: passersby-probe, path: out, retention-days: 3 }

  demo:
    if: inputs.mode == 'full'
    needs: [app-apk, wallet-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      TWO_EMULATORS: ${{ inputs.two_emulators && '1' || '' }}
      CI_FUNDER_KEYPAIR: ${{ secrets.CI_FUNDER_KEYPAIR }}
    steps:
      - name: Free disk space for two emulators (jlumbroso/free-disk-space v1.3.1, pinned)
        if: inputs.two_emulators
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          tool-cache: false
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: '*-apk', path: apks, merge-multiple: true }
      - run: ls -l apks
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: cd demo && npm ci --no-audit --no-fund
      - name: Install Maestro
        run: |
          curl -fsSL "https://github.com/mobile-dev-inc/maestro/releases/download/${MAESTRO_VERSION}/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get install -y -qq ffmpeg
      - name: Free disk space for the emulator image
        run: |
          df -h /
          rm -rf "$ANDROID_HOME/ndk" "$AGENT_TOOLSDIRECTORY"/CodeQL "$AGENT_TOOLSDIRECTORY"/Python "$AGENT_TOOLSDIRECTORY"/PyPy "$AGENT_TOOLSDIRECTORY"/go "$AGENT_TOOLSDIRECTORY"/Ruby
          df -h /
      - run: bash demo/ci/enable-kvm.sh
      - name: Two emulators up
        if: inputs.two_emulators
        run: bash demo/ci/emulators-up.sh
      - name: Record the demo (two emulators)
        if: inputs.two_emulators
        run: bash demo/ci/run-demo.sh
      - name: Record the demo (one emulator)
        if: ${{ !inputs.two_emulators }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 3072M
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-metrics -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash demo/ci/run-demo.sh
      - if: always()
        run: bash demo/ci/finish.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passersby-demo
          path: out
          retention-days: 14
